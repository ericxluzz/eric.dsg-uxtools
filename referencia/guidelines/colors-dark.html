<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><script src="../assets/js/conecta-icons.js"></script><style>body{padding:20px;background:var(--c-surface)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}.lbl{font-size:11px;color:var(--c-text-2);font-weight:500}body{padding:12px}</style></head><body><div data-tema="escuro" style="background:var(--c-page);padding:14px;border-radius:12px;color:var(--c-text)"><div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span style="height:44px;border-radius:8px;background:var(--c-page);border:1px solid var(--c-border)"></span><span style="font-size:11px;font-weight:600" class="e-nowrap">Página</span><span class="lbl e-nowrap" style="font-family:var(--e-font-mono);font-size:10px">--c-page</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span style="height:44px;border-radius:8px;background:var(--c-surface);border:1px solid var(--c-border)"></span><span style="font-size:11px;font-weight:600" class="e-nowrap">Superfície</span><span class="lbl e-nowrap" style="font-family:var(--e-font-mono);font-size:10px">--c-surface</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span style="height:44px;border-radius:8px;background:var(--c-surface-2);border:1px solid var(--c-border)"></span><span style="font-size:11px;font-weight:600" class="e-nowrap">Superfície 2</span><span class="lbl e-nowrap" style="font-family:var(--e-font-mono);font-size:10px">--c-surface-2</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span style="height:44px;border-radius:8px;background:var(--c-primary);border:1px solid var(--c-border)"></span><span style="font-size:11px;font-weight:600" class="e-nowrap">Primário</span><span class="lbl e-nowrap" style="font-family:var(--e-font-mono);font-size:10px">--c-primary</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span style="height:44px;border-radius:8px;background:var(--c-link);border:1px solid var(--c-border)"></span><span style="font-size:11px;font-weight:600" class="e-nowrap">Link</span><span class="lbl e-nowrap" style="font-family:var(--e-font-mono);font-size:10px">--c-link</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span style="height:44px;border-radius:8px;background:var(--c-strong);border:1px solid var(--c-border)"></span><span style="font-size:11px;font-weight:600" class="e-nowrap">Forte</span><span class="lbl e-nowrap" style="font-family:var(--e-font-mono);font-size:10px">--c-strong</span></div></div></div></body></html>
