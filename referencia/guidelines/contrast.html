<!-- @dsCard group="Colors" viewport="700x260" name="Contraste (WCAG AA)" subtitle="Calculado ao vivo nos dois temas" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><script src="../assets/js/conecta-icons.js"></script><style>body{padding:20px;background:var(--c-surface)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}.lbl{font-size:11px;color:var(--c-text-2);font-weight:500}</style></head><body><div id="o" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"></div><script>
function rgb(c){var d=document.createElement('i');d.style.color=c;document.body.appendChild(d);var m=getComputedStyle(d).color.match(/\d+(\.\d+)?/g).map(Number);d.remove();return m}
function lum(c){return [0,1,2].map(function(i){var v=c[i]/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce(function(a,v,i){return a+v*[.2126,.7152,.0722][i]},0)}
function cr(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
var P=[['text','surface',4.5],['text-2','surface',4.5],['text-2','page',4.5],['link','surface',4.5],['strong','soft',4.5],['on-primary','primary',4.5],['ok-fg','ok-bg',4.5],['warn-fg','warn-bg',4.5],['info-fg','info-bg',4.5],['bad-fg','bad-bg',4.5],['field-bd','surface',3],['focus','page',3]];
['claro','escuro'].forEach(function(t){var box=document.createElement('div');box.setAttribute('data-tema',t);box.style.cssText='background:var(--c-surface);border:1px solid var(--c-border);border-radius:10px;padding:10px;color:var(--c-text);font-size:12px;display:flex;flex-direction:column;gap:3px';document.getElementById('o').appendChild(box);var cs=getComputedStyle(box);box.innerHTML='<b style="font-size:12px">'+(t==='claro'?'Claro':'Escuro')+'</b>'+P.map(function(p){var r=cr(rgb(cs.getPropertyValue('--c-'+p[0])),rgb(cs.getPropertyValue('--c-'+p[1])));var ok=r>=p[2];return '<span style="display:flex;justify-content:space-between;gap:8px"><span>'+p[0]+' / '+p[1]+'</span><b style="color:var(--c-'+(ok?'ok':'bad')+'-fg)">'+r.toFixed(2)+(ok?' ✓':' ✗')+'</b></span>'}).join('')});
</script></body></html>
