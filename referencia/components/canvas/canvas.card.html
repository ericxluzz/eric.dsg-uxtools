<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../styles.css"><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><script src="../../../assets/js/conecta-icons.js"></script><style>body{padding:16px;background:var(--c-page)}</style></head><body><div class="e-canvas" style="height:288px"><div style="position:sticky;top:10px;left:10px;height:0;display:flex;justify-content:space-between;padding:0 10px"><div class="e-canvas__bar"><button class="e-canvas__tool"><c-icon name="square-plus" size="14" style="color:var(--c-link)"></c-icon>Etapa</button><button class="e-canvas__tool"><c-icon name="git-branch" size="14" style="color:#f59e0b"></c-icon>Situação</button></div><div class="e-canvas__bar"><button class="e-iconbtn e-iconbtn--sm"><c-icon name="minus" size="14"></c-icon></button><span style="min-width:42px;display:grid;place-items:center;font-size:12px">100%</span><button class="e-iconbtn e-iconbtn--sm"><c-icon name="plus" size="14"></c-icon></button></div></div><div style="padding:64px 24px 24px;display:flex;align-items:flex-start;width:max-content"><button class="e-node" style="width:220px"><span style="display:flex;align-items:center;gap:8px"><span class="e-node__n">1</span><b style="font-size:14px">Triagem</b><span style="margin-left:auto;font-size:11px;color:var(--c-text-2)">1 dia</span></span><span style="font-size:12px;color:var(--c-text-2)">Central de Triagem</span></button><div class="e-edge" style="padding-top:28px"><span class="e-edge__port"></span><span class="e-edge__line"></span><span class="e-edge__label">Enviar ao setor</span><span class="e-edge__line"></span><span class="e-edge__port"></span></div><button class="e-node e-node--selected" style="width:220px"><span class="e-node__flag">Selecionada</span><span style="display:flex;align-items:center;gap:8px"><span class="e-node__n">2</span><b style="font-size:14px">Vistoria</b><span style="margin-left:auto;font-size:11px;color:var(--c-text-2)">3 dias</span></span><span style="font-size:12px;color:var(--c-text-2)">Iluminação Pública</span><span style="display:flex;gap:6px"><span class="e-badge e-badge--info" style="height:20px;font-size:11px">Relatório v1</span><span class="e-badge e-badge--neu" style="height:20px;font-size:11px">3 situações</span></span></button><div class="e-edge" style="padding-top:28px"><span class="e-edge__line" style="background:none;border-top:2px dashed var(--c-link)"></span><button class="e-add-step"><c-icon name="plus" size="14"></c-icon>Adicionar etapa</button></div></div></div></body></html>
