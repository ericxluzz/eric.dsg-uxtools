<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../styles.css"><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><script src="../../../assets/js/conecta-icons.js"></script><style>body{padding:20px;background:var(--c-surface)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}.lbl{font-size:11px;color:var(--c-text-2);font-weight:500}</style></head><body><div class="col">
<div class="row"><button class="e-btn e-btn--primary"><c-icon name="plus" size="16"></c-icon>Nova solicitação</button><button class="e-btn e-btn--secondary"><c-icon name="download" size="16"></c-icon>Exportar</button><button class="e-btn e-btn--soft"><c-icon name="plus" size="14"></c-icon>Nova situação</button><button class="e-btn e-btn--ghost">Cancelar</button><button class="e-btn e-btn--success"><c-icon name="check" size="16"></c-icon>Concluir OS</button><button class="e-btn e-btn--danger-ghost"><c-icon name="trash-2" size="16"></c-icon>Remover</button><button class="e-btn e-btn--primary" disabled>Enviar</button></div>
<div class="row"><button class="e-btn e-btn--primary e-btn--sm">Receber<c-icon name="chevron-right" size="14"></c-icon></button><button class="e-btn e-btn--primary">md 34</button><button class="e-btn e-btn--primary e-btn--lg">lg 40</button><button class="e-btn e-btn--primary e-btn--xl">xl 46</button><button class="e-iconbtn" aria-label="Fechar"><c-icon name="x" size="16"></c-icon></button><button class="e-iconbtn e-iconbtn--outline" aria-label="Voltar"><c-icon name="arrow-left" size="16"></c-icon></button></div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px"><label class="e-field"><span class="e-field__label"><c-icon name="clock" size="13" style="color:var(--c-link)"></c-icon>Prazo</span><input class="e-input" value="3 dias úteis"><span class="e-field__help">Dias úteis a partir do recebimento</span></label><label class="e-field"><span class="e-field__label">E-mail<span class="e-field__req">*</span></span><input class="e-input" aria-invalid="true" value="regina@"><span class="e-field__err"><c-icon name="circle-alert" size="13"></c-icon>Informe um e-mail válido</span></label><div class="e-field"><span class="e-field__label"><c-icon name="building-2" size="13" style="color:var(--c-link)"></c-icon>Setor responsável</span><button class="e-select__btn"><span class="e-select__val">Iluminação Pública</span><c-icon name="chevron-down" size="14"></c-icon></button></div></div>
<div class="row" style="gap:20px"><label class="e-float" style="width:220px"><span class="e-float__label">E-mail</span><input class="e-float__input" value="regina.matos@amajari.rr.gov.br"></label><button class="e-switch" role="switch" aria-checked="true"><span class="e-switch__track"><span class="e-switch__thumb"></span></span>Manter conectado</button><label class="e-check"><input type="checkbox" checked>Permitir mais de uma OS</label><div class="e-seg" role="radiogroup"><button class="e-seg__opt" aria-checked="false">Comum</button><button class="e-seg__opt" aria-checked="true">Ordem de serviço</button></div></div></div></body></html>
